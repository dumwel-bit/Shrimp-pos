  }));
  el.querySelectorAll('.ex-del').forEach(b => b.addEventListener('click', async () => {
    const id = b.closest('.ex-row').dataset.id;
    const idx = expenses.findIndex(x => x.id === id);
    if(idx < 0) return;
    const removed = expenses[idx];
    expenses.splice(idx, 1);
    await saveExpenses(); renderExpenses();
    showUndoToast(t('ex_deleted'), async () => {
      expenses.splice(Math.min(idx, expenses.length), 0, removed);
      await saveExpenses(); renderExpenses();
    }, 8000);
  }));

  if(showExpenseForm){
    const editing = editingExpenseId ? expenses.find(x => x.id === editingExpenseId) : null;
    let curCat = editing ? editing.cat : 'plastic';
    let amtTouched = !!editing;
    const amt = el.querySelector('#exAmt'), qty = el.querySelector('#exQty');
    const upd = () => {
      const a = parseFloat(amt.value), q = parseFloat(qty.value);
      el.querySelector('#exTotal').textContent = (isNaN(a) || isNaN(q)) ? t('ex_total_hint') : t('ex_total', {amt: PESO(a * q)});
    };
    amt.addEventListener('input', () => { amtTouched = true; upd(); });
    qty.addEventListener('input', upd);
    el.querySelectorAll('.ex-chip').forEach(c => c.addEventListener('click', () => {
      curCat = c.dataset.cat;
      el.querySelectorAll('.ex-chip').forEach(x => x.classList.toggle('on', x === c));
      el.querySelector('#exQtyHint').textContent = t('eqh_' + curCat);
      if(!amtTouched){ amt.value = lastUnitAmt(curCat); }
      upd();
    }));
    upd();
    el.querySelector('#exCancel').addEventListener('click', () => { showExpenseForm = false; editingExpenseId = null; renderExpenses(); });
    el.querySelector('#exSave').addEventListener('click', async () => {
      const a = parseFloat(amt.value), q = parseFloat(qty.value);
      const err = el.querySelector('#exErr');
      if(isNaN(a) || a <= 0){ err.textContent = t('ex_err_amt'); return; }
      if(isNaN(q) || q <= 0){ err.textContent = t('ex_err_qty'); return; }
      const dateVal = el.querySelector('#exDate').value || todayInputValue();
      const note = el.querySelector('#exNote').value.trim();
      const total = Math.round(a * q * 100) / 100;
      let undoFn;
      if(editing){
        const before = {...editing};
        Object.assign(editing, {cat: curCat, unitAmt: a, qty: q, total, note, timestamp: expDateToIso(dateVal, editing.timestamp)});
        undoFn = async () => { const cur = expenses.find(x => x.id === before.id); if(cur) Object.assign(cur, before); await saveExpenses(); renderExpenses(); };
      }else{
        const ne = {id: uid(), timestamp: expDateToIso(dateVal), cat: curCat, unitAmt: a, qty: q, total, note};
        expenses.push(ne);
        undoFn = async () => { expenses = expenses.filter(x => x.id !== ne.id); await saveExpenses(); renderExpenses(); };
      }
      await saveExpenses();
      showExpenseForm = false; editingExpenseId = null;
      renderExpenses();
      showUndoToast(t('ex_saved', {amt: PESO(total)}), undoFn, 8000);
    });
  }
}

/* ---------- DAILY HISTORY ---------- */
let openDays = new Set([dkey(new Date())]);
let openDaysTouched = false;
function dayTitle(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const base = dt.toLocaleDateString(locale(), {weekday:'long', month:'short', day:'numeric'});
  const today = dkey(new Date());
  const yest = dkey(new Date(Date.now() - 86400000));
  if(key === today) return t('hd_today') + ' · ' + base;
  if(key === yest) return t('hd_yday') + ' · ' + base;
  return base;
}
function historyDaysHtml(){
  const r3 = v => Math.round(v * 1000) / 1000;
  const days = {};
  const get = k => days[k] || (days[k] = {sales:[], total:0, sold:{}, added:{}});
  sales.forEach(s => {
    const k = dkey(new Date(s.timestamp)); const dd = get(k);
    dd.sales.push(s); dd.total += s.total;
    s.items.forEach(i => {
      const o = dd.sold[i.productId] || (dd.sold[i.productId] = {name:i.name, unit:i.unit, qty:0});
      o.qty += i.qty;
    });
  });
  purchases.forEach(pu => {
    const k = dkey(new Date(pu.timestamp)); const dd = get(k);
    const o = dd.added[pu.productId] || (dd.added[pu.productId] = {name:pu.productName, qty:0});
    o.qty += pu.qty;
  });
  const keys = Object.keys(days).sort().reverse();
  // stock left at end of each day = now - later restocks + later sales
  const left = {}; products.forEach(p => left[p.id] = p.stock);
  const leftByDay = {};
  keys.forEach(k => {               // newest first
    leftByDay[k] = {...left};
    const dd = days[k];
    Object.entries(dd.added).forEach(([id,o]) => { if(id in left) left[id] = r3(left[id] - o.qty); });
    Object.entries(dd.sold).forEach(([id,o]) => { if(id in left) left[id] = r3(left[id] + o.qty); });
  });
  return keys.map(k => {
    const dd = days[k];
    const open = openDays.has(k);
    const n = dd.sales.length;
    let h = `<div class="day-group"><button class="day-head" data-day="${k}">
      <span class="dh-l"><b>${escapeHtml(dayTitle(k))}</b><small>${t(n === 1 ? 'hd_orders_one' : 'hd_orders_many', {n})}</small></span>
      <span class="dh-r">${PESO(dd.total)}<i>${open ? '▲' : '▼'}</i></span></button>`;
    if(open){
      h += dd.sales.map(s => {
        const d = new Date(s.timestamp);
        const timeStr = d.toLocaleTimeString(locale(), {hour:'numeric', minute:'2-digit'});
        const itemsStr = s.items.map(i => {
          const wasDiscounted = i.originalPrice && Math.abs(i.originalPrice - i.price) > 0.001;
          return `${i.name} x${fmtQty(i.qty)}` + (wasDiscounted ? ' (' + t('disc_to', {price: PESO(i.price)}) + ')' : '');
        }).join(', ');
        return `<div class="sale-card">
          <div class="sale-top"><span class="sale-time">${timeStr}</span><span class="sale-total">${PESO(s.total)}</span></div>
          <div class="sale-items">${escapeHtml(itemsStr)}</div>
          ${s.discount ? `<div style="font-size:11px;color:var(--coral-dark);margin-top:4px;font-weight:700;">${t('disc_given', {amt: PESO(s.discount)})}</div>` : ''}
        </div>`;
      }).join('') || `<div class="t-sub" style="margin:6px 2px;">${t('hd_nosales')}</div>`;
      const ids = [...new Set([...Object.keys(dd.sold), ...Object.keys(dd.added)])];
      h += `<div class="day-stock"><div class="ds-title">${t('hd_stock')}</div>
        <div class="ds-row ds-hd"><span>&nbsp;</span><span>${t('hd_sold')}</span><span>${t('hd_added')}</span><span>${t('hd_left')}</span></div>` +
        ids.map(id => {
          const pr = products.find(x => x.id === id);
          const nm = pr ? pr.name : ((dd.sold[id] || dd.added[id]).name);
          const sold = dd.sold[id] ? fmtQty(dd.sold[id].qty) : '–';
          const add = dd.added[id] ? '+' + fmtQty(dd.added[id].qty) : '–';
          const lf = (id in leftByDay[k]) ? fmtQty(Math.max(0, leftByDay[k][id])) : '–';
          return `<div class="ds-row"><span>${escapeHtml(nm)}</span><span>${sold}</span><span>${add}</span><span><b>${lf}</b></span></div>`;
        }).join('') + `</div>`;
    }
    return h + `</div>`;
  }).join('');
}

/* ---------- HISTORY TAB ---------- */
function renderHistory(){
  const el = document.getElementById('tab-history');
  const today = new Date().toDateString();
  const todaySales = sales.filter(s => new Date(s.timestamp).toDateString() === today);
  const todaySum = todaySales.reduce((a,s) => a + s.total, 0);
  const allSum = sales.reduce((a,s) => a + s.total, 0);
  const todayDiscount = todaySales.reduce((a,s) => a + (s.discount || 0), 0);

  let html = `<div class="hist-summary">
    <div class="hist-stat"><div class="n">${PESO(todaySum)}</div><div class="l">${t('today_n', {n: todaySales.length})}</div></div>
    <div class="hist-stat"><div class="n">${PESO(allSum)}</div><div class="l">${t('alltime_n', {n: sales.length})}</div></div>
  </div>`;
  if(todayDiscount > 0){
    html += `<div style="font-size:12px;color:var(--ink-soft);margin:-6px 0 14px 2px;">${t('disc_today', {amt: PESO(todayDiscount)})}</div>`;
  }

  if(sales.length === 0){
    html += '<div class="empty-note">' + t('no_sales_rec') + '</div>';
  }else{
    html += historyDaysHtml();
  }
  html += backupCardHtml();
  el.innerHTML = html;
  el.querySelectorAll('.day-head').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.day;
    if(openDays.has(k)) openDays.delete(k); else openDays.add(k);
    renderHistory();
  }));
  bindBackupHandlers(el);
}

/* ---------- BACKUP AND RESTORE ---------- */
let lastBackup = null;
let pendingRestore = null;

function backupCardHtml(){
  let status = t('bk_none');
  let stale = true;
  if(lastBackup){
    const d = new Date(lastBackup);
    const days = Math.floor((Date.now() - d.getTime()) / 86400000);
    status = t('bk_last', {date: d.toLocaleDateString(locale(),{month:'short',day:'numeric'}), time: d.toLocaleTimeString(locale(),{hour:'numeric',minute:'2-digit'})});
    stale = days >= 7;
  }
  let restoreArea = '';
  if(pendingRestore){
    const b = pendingRestore;
    const when = b.exportedAt ? new Date(b.exportedAt).toLocaleDateString(locale(),{month:'short',day:'numeric',year:'numeric'}) : t('bk_unknown');
    restoreArea = `<div class="highlight-line" style="margin-top:10px;">${t('bk_summary', {when, s: b.sales.length, p: b.products.length})}<br>${t('bk_warn')}</div>
      <div class="two-btns" style="margin-top:8px;">
        <button class="secondary" id="restoreCancel">${t('cancel')}</button>
        <button class="primary" id="restoreConfirm">${t('bk_replace')}</button>
      </div>`;
  }
  return `<div class="t-card" style="margin-top:18px;">
    <h3>${t('bk_title')}</h3>
    <div class="t-sub" style="${stale ? 'color:var(--red);font-weight:700;' : ''}">${status}</div>
    <div class="t-sub">${t('bk_desc')}</div>
    <div class="two-btns" style="margin-top:8px;">
      <button class="primary" id="backupDownload">${t('bk_save')}</button>
      <button class="secondary" id="backupRestorePick">${t('bk_restore')}</button>
    </div>
    <input type="file" id="backupFile" accept=".json,application/json" style="display:none;">
    <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px;">
      <div style="font-weight:700;font-size:14px;color:var(--red);">${t('er_title')}</div>
      <div class="t-sub">${t('er_desc')}</div>
      <button id="eraseBtn" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--red);background:#fff;color:var(--red);font-weight:700;font-size:14px;cursor:pointer;">${t('er_btn')}</button>
    </div>
    <div id="backupMsg" style="font-size:12px;margin-top:8px;color:var(--ink-soft);"></div>
    ${restoreArea}
  </div>`;
}

function bindBackupHandlers(el){
  const msg = el.querySelector('#backupMsg');
  el.querySelector('#backupDownload').addEventListener('click', async () => {
    const data = {app:'shrimp-pos', version:1, exportedAt:new Date().toISOString(), products, sales, purchases, expenses};
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'shrimp-pos-backup-' + dkey(new Date()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    lastBackup = data.exportedAt;
    try{ await window.storage.set('last-backup', lastBackup); }catch(e){}
    renderHistory();
    const m = document.getElementById('backupMsg');
    if(m) m.textContent = t('bk_saved');
  });
  const fileInput = el.querySelector('#backupFile');
  el.querySelector('#backupRestorePick').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const d = JSON.parse(reader.result);
        if(!d || !Array.isArray(d.products) || !Array.isArray(d.sales)) throw new Error('bad');
        d.purchases = Array.isArray(d.purchases) ? d.purchases : [];
        d.expenses = Array.isArray(d.expenses) ? d.expenses : [];
        pendingRestore = d;
        renderHistory();
      }catch(e){
        msg.style.color = 'var(--red)';
        msg.textContent = t('bk_badfile');
      }
    };
    reader.readAsText(f);
  });
  const cancel = el.querySelector('#restoreCancel');
  if(cancel) cancel.addEventListener('click', () => { pendingRestore = null; renderHistory(); });
  const eraseBtn = el.querySelector('#eraseBtn');
  let eraseTimer = null;
  eraseBtn.addEventListener('click', async () => {
    if(!eraseTimer){
      eraseBtn.textContent = t('er_confirm');
      eraseBtn.style.background = 'var(--red)'; eraseBtn.style.color = '#fff';
      eraseTimer = setTimeout(() => {
        eraseTimer = null;
        eraseBtn.textContent = t('er_btn');
        eraseBtn.style.background = '#fff'; eraseBtn.style.color = 'var(--red)';
      }, 3500);
      return;
    }
    clearTimeout(eraseTimer); eraseTimer = null;
    products = []; sales = []; purchases = []; expenses = []; cart = {};
    pendingRestore = null; lastBackup = null;
    await saveProducts(); await saveSales(); await savePurchases(); await saveExpenses();
    try{ await window.storage.set('last-backup', '', false); }catch(e){}
    try{ await window.storage.set('tour-done', '', false); }catch(e){}
    hideUndoToast(); resetClearButtons();
    renderSell(); updateCartBar(); updateTodayHeader(); renderHistory();
    const m = document.getElementById('backupMsg');
    if(m) m.textContent = t('er_done');
  });

  const confirmBtn = el.querySelector('#restoreConfirm');
  if(confirmBtn) confirmBtn.addEventListener('click', async () => {
    products = pendingRestore.products;
    sales = pendingRestore.sales;
    purchases = pendingRestore.purchases;
    expenses = pendingRestore.expenses || [];
    products.forEach(p => {
      if(typeof p.costPrice !== 'number') p.costPrice = 0;
      if(typeof p.stock !== 'number') p.stock = 0;
      if(typeof p.lowStock !== 'number') p.lowStock = 1;
    });
    pendingRestore = null;
    cart = {};
    await saveProducts(); await saveSales(); await savePurchases(); await saveExpenses();
    renderSell(); updateTodayHeader(); renderHistory();
    const m = document.getElementById('backupMsg');
    if(m) m.textContent = t('bk_restored');
  });
}

/* ---------- TRENDS TAB ---------- */
let trendRange = 7;
let calMonth = null;
let calSelected = null;

let DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function dkey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function shortPeso(v){
  if(v >= 1000) return '₱' + (v/1000).toFixed(v >= 10000 ? 0 : 1).replace(/\.0$/,'') + 'k';
  return '₱' + Math.round(v);
}
function hourLabel(h){
  return (h % 12 === 0 ? 12 : h % 12) + ' ' + (h >= 12 ? 'PM' : 'AM');
}
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }

function salesByDay(){
  const m = {};
  sales.forEach(s => {
    const k = dkey(new Date(s.timestamp));
    if(!m[k]) m[k] = {total:0, count:0, list:[]};
    m[k].total += s.total;
    m[k].count += 1;
    m[k].list.push(s);
  });
  return m;
}

function salesInRange(start, endExclusive){
  return sales.filter(s => {
    const t = new Date(s.timestamp);
    return t >= start && t < endExclusive;
  });
}

function renderTrends(){
  DOW_SHORT = dowArr();
  const rangeTxt = t(trendRange === 7 ? 'range_7' : 'range_30');
  const el = document.getElementById('tab-trends');
  if(!calMonth){ const n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
  const today = startOfDay(new Date());
  const byDay = salesByDay();

  const rangeStart = addDays(today, -(trendRange - 1));
  const rangeEnd = addDays(today, 1);
  const prevStart = addDays(rangeStart, -trendRange);
  const inRange = salesInRange(rangeStart, rangeEnd);
  const inPrev = salesInRange(prevStart, rangeStart);
  const rangeTotal = inRange.reduce((a,s) => a + s.total, 0);
  const prevTotal = inPrev.reduce((a,s) => a + s.total, 0);

  const days = [];
  for(let i = 0; i < trendRange; i++){
    const d = addDays(rangeStart, i);
    const rec = byDay[dkey(d)];
    days.push({date:d, total: rec ? rec.total : 0});
  }
  const maxDay = Math.max(...days.map(d => d.total), 0);
  const bestDay = days.reduce((b,d) => d.total > b.total ? d : b, days[0]);

  let deltaHtml = '';
  if(prevTotal > 0){
    const pct = ((rangeTotal - prevTotal) / prevTotal) * 100;
    deltaHtml = `<span class="${pct >= 0 ? 'delta-up' : 'delta-down'}">${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(0)}%</span> ${t('vs_prev', {n: trendRange, amt: PESO(prevTotal)})}`;
  }else{
    deltaHtml = t('no_prev', {n: trendRange});
  }

  let html = `<div class="range-toggle">
    <button data-range="7" class="${trendRange === 7 ? 'active' : ''}">${t('last7')}</button>
    <button data-range="30" class="${trendRange === 30 ? 'active' : ''}">${t('last30')}</button>
  </div>`;

  html += `<div class="hist-summary">
    <div class="hist-stat"><div class="n">${PESO(rangeTotal)}</div><div class="l">${t('sales_orders', {n: inRange.length})}</div></div>
    <div class="hist-stat"><div class="n">${PESO(rangeTotal / trendRange)}</div><div class="l">${t('avg_day')}</div></div>
  </div>
  <div class="highlight-line">${deltaHtml}${maxDay > 0 ? `<br>${t('best_day_line', {day: '<b>' + DOW_SHORT[bestDay.date.getDay()] + ', ' + bestDay.date.toLocaleDateString(locale(),{month:'short',day:'numeric'}) + '</b>', amt: PESO(bestDay.total)})}` : ''}</div>`;

  /* daily bar chart */
  html += `<div class="t-card"><h3>${t('daily_sales')}</h3>`;
  if(rangeTotal === 0){
    html += `<div class="empty-note" style="padding:20px;">${t('no_period')}</div>`;
  }else{
    html += `<div class="bars">` + days.map(d => {
      const h = maxDay > 0 ? Math.max(Math.round((d.total / maxDay) * 118), d.total > 0 ? 4 : 2) : 2;
      const cls = d.total === 0 ? 'zero' : (d.total === maxDay ? 'best' : '');
      return `<div class="bar-col" title="${dkey(d.date)}: ${PESO(d.total)}"><div class="bar ${cls}" style="height:${h}px"></div></div>`;
    }).join('') + `</div><div class="bar-lbls">` + days.map((d,i) => {
      if(trendRange === 7) return `<span>${DOW_SHORT[d.date.getDay()].slice(0,2)}<br>${d.date.getDate()}</span>`;
      return `<span>${i % 5 === 0 || i === days.length - 1 ? d.date.getDate() : ''}</span>`;
    }).join('') + `</div>`;
    html += `<div class="t-sub" style="margin:8px 0 0 0;">${t('bar_hint')}</div>`;
  }
  html += `</div>`;

  /* calendar */
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  const firstDow = new Date(y, mo, 1).getDay();
  const dim = new Date(y, mo + 1, 0).getDate();
  let monthMax = 0, monthTotal = 0;
  for(let d = 1; d <= dim; d++){
    const rec = byDay[dkey(new Date(y, mo, d))];
    if(rec){ monthMax = Math.max(monthMax, rec.total); monthTotal += rec.total; }
  }
  const nowMonth = new Date();
  const atCurrentMonth = (y === nowMonth.getFullYear() && mo === nowMonth.getMonth());
  html += `<div class="t-card"><div class="cal-head">
    <button data-cal="-1" aria-label="${t('prev_month')}">&lsaquo;</button>
    <div style="text-align:center;"><div class="mname">${calMonth.toLocaleDateString(locale(),{month:'long',year:'numeric'})}</div>
    <div style="font-size:12px;color:var(--ink-soft);">${t('this_month', {amt: PESO(monthTotal)})}</div></div>
    <button data-cal="1" aria-label="${t('next_month')}" ${atCurrentMonth ? 'style="opacity:.35"' : ''}>&rsaquo;</button>
  </div><div class="cal-grid">`;
  DOW_SHORT.forEach(n => { html += `<div class="cal-dow">${n.slice(0,1)}</div>`; });
  for(let i = 0; i < firstDow; i++) html += `<div class="cal-cell empty"></div>`;
  for(let d = 1; d <= dim; d++){
    const dt = new Date(y, mo, d);
    const k = dkey(dt);
    const rec = byDay[k];
    let style = '';
    if(rec && monthMax > 0){
      const inten = rec.total / monthMax;
      const alpha = 0.15 + 0.75 * inten;
      style = `background:rgba(232,115,74,${alpha.toFixed(2)});border-color:rgba(232,115,74,${alpha.toFixed(2)});${inten > 0.6 ? 'color:#fff;' : ''}`;
    }
    const cls = ['cal-cell'];
    if(dkey(today) === k) cls.push('today');
    if(calSelected === k) cls.push('sel');
    html += `<div class="${cls.join(' ')}" data-day="${k}" style="${style}"><span class="dn">${d}</span><span class="da">${rec ? shortPeso(rec.total) : ''}</span></div>`;
  }
  html += `</div><div class="cal-legend">${t('less')} <i style="background:rgba(232,115,74,.2)"></i><i style="background:rgba(232,115,74,.5)"></i><i style="background:rgba(232,115,74,.9)"></i> ${t('more_sales')}</div>`;

  if(calSelected){
    const rec = byDay[calSelected];
    const parts = calSelected.split('-').map(Number);
    const dd = new Date(parts[0], parts[1]-1, parts[2]);
    html += `<div class="day-detail"><div class="dd-title">${dd.toLocaleDateString(locale(),{weekday:'long',month:'long',day:'numeric'})}</div>`;
    if(!rec){
      html += `<div class="t-sub" style="margin:0;">${t('no_sales_day')}</div>`;
    }else{
      html += `<div class="t-sub" style="margin:0 0 6px 0;">${t(rec.count === 1 ? 'day_total_one' : 'day_total_many', {amt: PESO(rec.total), n: rec.count})}</div>`;
      html += rec.list.slice().sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp)).map(s => {
        const t = new Date(s.timestamp).toLocaleTimeString(locale(),{hour:'numeric',minute:'2-digit'});
        const items = s.items.map(i => `${i.name} x${fmtQty(i.qty)}`).join(', ');
        return `<div class="day-sale"><span>${t}</span><span class="ds-items">${escapeHtml(items)}</span><span class="ds-amt">${PESO(s.total)}</span></div>`;
      }).join('');
    }
    html += `</div>`;
  }
  html += `</div>`;

  /* busiest hours */
  html += `<div class="t-card"><h3>${t('busiest')}</h3><div class="t-sub">${t('by_time', {range: rangeTxt})}</div>`;
  const hours = new Array(24).fill(0);
  inRange.forEach(s => { hours[new Date(s.timestamp).getHours()] += s.total; });
  const hMax = Math.max(...hours);
  if(hMax <= 0){
    html += `<div class="t-sub" style="margin:0;">${t('no_sales_yet')}</div>`;
  }else{
    const active = hours.map((v,h) => v > 0 ? h : -1).filter(h => h >= 0);
    const from = Math.min(...active), to = Math.max(...active);
    const bestH = hours.indexOf(hMax);
    html += `<div class="highlight-line">${t('best_hour', {h: '<b>' + hourLabel(bestH) + '</b>', amt: PESO(hMax)})}</div>`;
    for(let h = from; h <= to; h++){
      const w = Math.round((hours[h] / hMax) * 100);
      html += `<div class="h-row"><span class="hl">${hourLabel(h)}</span><div class="hb"><div class="${h === bestH ? 'best' : ''}" style="width:${w}%"></div></div><span class="hv">${hours[h] > 0 ? PESO(hours[h]) : '-'}</span></div>`;
    }
  }
  html += `</div>`;

  /* day of week */
  html += `<div class="t-card"><h3>${t('best_dow')}</h3><div class="t-sub">${t('avg_range', {range: rangeTxt})}</div>`;
  const dowTotal = new Array(7).fill(0), dowDays = new Array(7).fill(0);
  days.forEach(d => { dowTotal[d.date.getDay()] += d.total; dowDays[d.date.getDay()] += 1; });
  const dowAvg = dowTotal.map((t,i) => dowDays[i] > 0 ? t / dowDays[i] : null);
  const dowMax = Math.max(...dowAvg.map(v => v || 0));
  if(dowMax <= 0){
    html += `<div class="t-sub" style="margin:0;">${t('no_sales_yet')}</div>`;
  }else{
    const order = [1,2,3,4,5,6,0];
    const bestD = dowAvg.indexOf(dowMax);
    html += `<div class="highlight-line">${t('strongest', {d: DOW_SHORT[bestD], amt: PESO(dowMax)})}</div>`;
    order.forEach(i => {
      if(dowAvg[i] === null) return;
      const w = Math.round((dowAvg[i] / dowMax) * 100);
      html += `<div class="h-row"><span class="hl">${DOW_SHORT[i]}</span><div class="hb"><div class="${i === bestD ? 'best' : ''}" style="width:${w}%"></div></div><span class="hv">${PESO(dowAvg[i])}</span></div>`;
    });
  }
  html += `</div>`;

  /* products */
  const agg = {};
  products.forEach(p => { agg[p.name] = {name:p.name, unit:p.unit, qty:0, rev:0}; });
  inRange.forEach(s => s.items.forEach(i => {
    if(!agg[i.name]) agg[i.name] = {name:i.name, unit:i.unit, qty:0, rev:0};
    agg[i.name].qty += i.qty;
    agg[i.name].rev += i.price * i.qty;
  }));
  const list = Object.values(agg).sort((a,b) => b.rev - a.rev);
  html += `<div class="t-card"><h3>${t('prod_rank')}</h3><div class="t-sub">${t('ranked', {range: rangeTxt})}</div>`;
  if(list.length === 0 || list[0].rev <= 0){
    html += `<div class="t-sub" style="margin:0;">${t('no_prod_sales')}</div>`;
  }else{
    const top = list[0].rev;
    list.forEach((p, idx) => {
      const w = Math.round((p.rev / top) * 100);
      const slow = idx >= list.length - 2 && list.length > 3 && idx > 0;
      html += `<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;">
          <span>${escapeHtml(p.name)}${p.rev === 0 ? '<span class="slow-tag">' + t('tag_nosales') + '</span>' : (slow ? '<span class="slow-tag">' + t('tag_slow') + '</span>' : '')}</span>
          <span style="font-variant-numeric:tabular-nums;">${PESO(p.rev)}</span>
        </div>
        <div class="hb" style="background:var(--sand);border-radius:5px;height:10px;overflow:hidden;margin-top:4px;"><div style="height:100%;width:${w}%;background:${idx === 0 ? 'var(--teal)' : 'var(--coral)'};border-radius:5px;"></div></div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${escapeHtml(t('sold_n', {qty: fmtQty(p.qty), unit: unitWord(p.unit)}))}</div>
      </div>`;
    });
  }
  html += `</div>`;

  el.innerHTML = html;

  el.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => {
    trendRange = parseInt(b.dataset.range, 10);
    renderTrends();
  }));
  el.querySelectorAll('[data-cal]').forEach(b => b.addEventListener('click', () => {
    const dir = parseInt(b.dataset.cal, 10);
    const next = new Date(calMonth.getFullYear(), calMonth.getMonth() + dir, 1);
    const n = new Date();
    if(next > new Date(n.getFullYear(), n.getMonth(), 1)) return;
    calMonth = next;
    calSelected = null;
    renderTrends();
  }));
  el.querySelectorAll('[data-day]').forEach(c => c.addEventListener('click', () => {
    calSelected = (calSelected === c.dataset.day) ? null : c.dataset.day;
    renderTrends();
  }));
}

/* ---------- TAB SWITCHING ---------- */
let currentTab = 'sell';
function switchTab(name){
  currentTab = name;
  hideUndoToast();
  clearTimeout(clearPendingTimer);
  resetClearButtons();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.getElementById('tab-sell').style.display = name === 'sell' ? 'block' : 'none';
  document.getElementById('tab-products').style.display = name === 'products' ? 'block' : 'none';
  document.getElementById('tab-inventory').style.display = name === 'inventory' ? 'block' : 'none';
  document.getElementById('tab-history').style.display = name === 'history' ? 'block' : 'none';
  document.getElementById('tab-trends').style.display = name === 'trends' ? 'block' : 'none';
  document.getElementById('tab-expenses').style.display = name === 'expenses' ? 'block' : 'none';
  if(name !== 'expenses'){ showExpenseForm = false; editingExpenseId = null; }
  if(name === 'expenses') renderExpenses();
  if(name === 'trends') renderTrends();
  if(name === 'products') renderProducts();
  if(name === 'inventory') renderInventory();
  if(name === 'history') renderHistory();
}

/* ---------- TUTORIAL ---------- */
const TOUR = [
  {tab:'sell', target:null, k:'t1'},
  {tab:'products', target:'nav button[data-tab="products"]', k:'t2'},
  {tab:'sell', target:'#tab-sell .product-card', k:'t3'},
  {tab:'sell', target:'#tab-sell .chip-row', k:'t4'},
  {tab:'sell', target:null, k:'t5'},
  {tab:'sell', target:null, k:'t6'},
  {tab:'inventory', target:'nav button[data-tab="inventory"]', k:'t7'},
  {tab:'expenses', target:'nav button[data-tab="expenses"]', k:'t7b'},
  {tab:'trends', target:'nav button[data-tab="trends"]', k:'t8'},
  {tab:'history', target:'#backupDownload', k:'t9'},
  {tab:'sell', target:null, k:'t10'}
];
let tourIdx = 0;
let tourOn = false;

function startTour(){
  tourOn = true;
  tourIdx = 0;
  document.getElementById('tour').classList.remove('hidden');
  showTourStep();
}

async function endTour(){
  tourOn = false;
  document.getElementById('tour').classList.add('hidden');
  document.getElementById('tourRing').style.display = 'none';
  switchTab('sell');
  window.scrollTo(0, 0);
  try{ await window.storage.set('tour-done', '1', false); }catch(e){}
}

function showTourStep(){
  const s = TOUR[tourIdx];
  if(s.tab) switchTab(s.tab);
  document.getElementById('tcStep').textContent = t('tour_step', {n: tourIdx + 1, total: TOUR.length});
  document.getElementById('tcTitle').textContent = t(s.k + '_title');
  document.getElementById('tcBody').textContent = t(s.k + '_body');
  document.getElementById('tcDots').innerHTML = TOUR.map((_, i) => `<i class="${i === tourIdx ? 'on' : ''}"></i>`).join('');
  document.getElementById('tcBack').textContent = t('tour_back');
  document.getElementById('tcBack').style.visibility = tourIdx === 0 ? 'hidden' : 'visible';
  document.getElementById('tcNext').textContent = t(tourIdx === TOUR.length - 1 ? 'tour_start' : 'tour_next');
  document.getElementById('tcSkip').style.visibility = tourIdx === TOUR.length - 1 ? 'hidden' : 'visible';
  const ring = document.getElementById('tourRing');
  ring.style.display = 'none';
  document.getElementById('tourBlock').classList.remove('clear');
  const card = document.getElementById('tourCard');
  card.style.top = 'auto'; card.style.bottom = '12px';
  setTimeout(positionTour, 80);
}

function positionTour(){
  if(!tourOn) return;
  const s = TOUR[tourIdx];
  const el = s.target ? document.querySelector(s.target) : null;
  const ring = document.getElementById('tourRing');
  const card = document.getElementById('tourCard');
  if(!el){
    ring.style.display = 'none';
    document.getElementById('tourBlock').classList.remove('clear');
    card.style.top = 'auto'; card.style.bottom = '12px';
    return;
  }
  if(!el.closest('header')) el.scrollIntoView({block:'center'});
  setTimeout(() => {
    if(!tourOn) return;
    const r = el.getBoundingClientRect();
    ring.style.left = (r.left - 6) + 'px';
    ring.style.top = (r.top - 6) + 'px';
    ring.style.width = (r.width + 12) + 'px';
    ring.style.height = (r.height + 12) + 'px';
    ring.style.display = 'block';
    document.getElementById('tourBlock').classList.add('clear');
    const lowerHalf = (r.top + r.height / 2) > window.innerHeight * 0.5;
    if(lowerHalf){ card.style.bottom = 'auto'; card.style.top = '12px'; }
    else { card.style.top = 'auto'; card.style.bottom = '12px'; }
  }, 60);
}

window.addEventListener('resize', positionTour);

/* ---------- INIT ---------- */
async function init(){
  await loadLang();
  applyStaticI18n();
  setTodayDate();
  document.getElementById('tab-sell').innerHTML = '<div class="loading">' + t('loading') + '</div>';
  await loadData();
  renderSell();
  updateTodayHeader();

  document.querySelectorAll('nav button').forEach(b => {
    b.addEventListener('click', () => switchTab(b.dataset.tab));
  });
  document.getElementById('viewCartBtn').addEventListener('click', openCartModal);
  document.getElementById('clearCartBtn').addEventListener('click', clearCart);
  document.getElementById('clearCartBtnModal').addEventListener('click', clearCart);
  document.getElementById('closeCart').addEventListener('click', closeCartModal);
  document.getElementById('cartModal').addEventListener('click', (e) => {
    if(e.target.id === 'cartModal') closeCartModal();
  });
  document.getElementById('cashInput').addEventListener('input', updateChangeLine);
  document.getElementById('completeBtn').addEventListener('click', completeSale);

  document.getElementById('closeAmt').addEventListener('click', closeAmountModal);
  document.getElementById('amtModal').addEventListener('click', (e) => {
    if(e.target.id === 'amtModal') closeAmountModal();
  });
  document.getElementById('amtInput').addEventListener('input', updateAmountPreview);
  document.getElementById('amtAddBtn').addEventListener('click', addByAmount);

  document.getElementById('closeWeight').addEventListener('click', closeWeightModal);
  document.getElementById('weightModal').addEventListener('click', (e) => {
    if(e.target.id === 'weightModal') closeWeightModal();
  });
  document.querySelectorAll('#weightUnitToggle button').forEach(b => {
    b.addEventListener('click', () => {
      weightUnit = b.dataset.u;
      document.getElementById('weightInput').value = '';
      renderWeightUnit();
    });
  });
  document.getElementById('weightInput').addEventListener('input', updateWeightPreview);
  document.getElementById('weightAddBtn').addEventListener('click', addByWeight);

  document.getElementById('closePrice').addEventListener('click', closePriceModal);
  document.getElementById('priceModal').addEventListener('click', (e) => {
    if(e.target.id === 'priceModal') closePriceModal();
  });
  document.getElementById('priceModalInput').addEventListener('input', updatePricePreview);
  document.getElementById('priceThisSale').addEventListener('click', () => applyPrice(false));
  document.getElementById('priceSaveNew').addEventListener('click', () => applyPrice(true));

  document.getElementById('closeRestock').addEventListener('click', closeRestockModal);
  document.getElementById('restockModal').addEventListener('click', (e) => {
    if(e.target.id === 'restockModal') closeRestockModal();
  });
  document.getElementById('restockQty').addEventListener('input', updateRestockPreview);
  document.getElementById('restockCost').addEventListener('input', updateRestockPreview);
  document.getElementById('restockAddBtn').addEventListener('click', submitRestock);

  document.getElementById('helpBtn').addEventListener('click', startTour);
  document.getElementById('tcNext').addEventListener('click', () => {
    if(tourIdx >= TOUR.length - 1){ endTour(); return; }
    tourIdx += 1;
    showTourStep();
  });
  document.getElementById('tcBack').addEventListener('click', () => {
    if(tourIdx > 0){ tourIdx -= 1; showTourStep(); }
  });
  document.getElementById('tcSkip').addEventListener('click', endTour);

  document.getElementById('langBtn').addEventListener('click', () => openLangModal(false));
  document.getElementById('closeLang').addEventListener('click', closeLangModal);
  document.getElementById('langModal').addEventListener('click', (e) => {
    if(e.target.id === 'langModal' && !langFirstRun) closeLangModal();
  });
  let lastDay = dkey(new Date());
  const checkDay = () => {
    const k = dkey(new Date());
    if(k === lastDay) return;
    lastDay = k;
    openDays.add(k);
    setTodayDate(); updateTodayHeader();
    if(currentTab === 'sell') renderSell();
    if(currentTab === 'history') renderHistory();
    if(currentTab === 'expenses') renderExpenses();
    if(currentTab === 'trends') renderTrends();
  };
  setInterval(checkDay, 30000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) checkDay(); });
  applyStaticI18n();

  if(!langStored && sales.length === 0) openLangModal(true);
  else await maybeStartTour();
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

</script>
