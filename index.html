<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Shrimp Stall POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F3D3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --teal:#0F3D3E;
    --teal-dark:#0A2B2C;
    --sand:#F7F0E1;
    --card:#FFFFFF;
    --coral:#E8734A;
    --coral-dark:#C65A34;
    --ink:#22302E;
    --ink-soft:#5C6D69;
    --line:#E4DCC8;
    --green:#3E7D5A;
    --red:#B4432F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    padding-bottom:90px;
  }
  header{
    background:var(--teal);
    color:#fff;
    padding:16px 16px 0 16px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .brand-name{font-size:20px;font-weight:700;letter-spacing:0.2px;}
  .brand-sub{font-size:12px;color:#B9D6CE;margin-top:2px;}
  .today-stat{text-align:right;}
  .today-stat .num{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .today-stat .label{font-size:11px;color:#B9D6CE;}
  nav{display:flex;gap:2px;margin-top:14px;}
  nav button{
    flex:1;
    background:transparent;
    border:none;
    color:#B9D6CE;
    font-size:11.5px;
    font-weight:600;
    padding:10px 1px 12px 1px;
    border-bottom:3px solid transparent;
    cursor:pointer;
    white-space:nowrap;
  }
  nav button.active{color:#fff;border-bottom-color:var(--coral);}

  main{padding:16px;max-width:640px;margin:0 auto;}

  /* Sell tab */
  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .product-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    cursor:pointer;
    position:relative;
    min-height:88px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .product-card:active{transform:scale(0.97);}
  .product-card .pname{font-weight:700;font-size:15px;line-height:1.25;}
  .product-card .pmeta{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .product-card .pprice{font-size:15px;font-weight:700;color:var(--coral-dark);margin-top:8px;font-variant-numeric:tabular-nums;}
  .qty-badge{
    position:absolute;top:-8px;right:-8px;
    background:var(--coral);color:#fff;
    min-width:26px;height:26px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;padding:0 6px;
  }
  .amt-chip{
    align-self:flex-start;margin-top:8px;
    background:var(--sand);border:1px solid var(--line);color:var(--teal);
    font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;cursor:pointer;
  }
  .amt-chip:active{transform:scale(0.96);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip-row .amt-chip{margin-top:0;align-self:auto;}
  .pprice .was{font-size:12px;text-decoration:line-through;color:#B0A78F;font-weight:600;margin-right:4px;}
  .unit-toggle{display:flex;gap:8px;margin-top:10px;}
  .unit-toggle button{
    flex:1;padding:10px;border-radius:9px;border:1px solid var(--line);
    background:#fff;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .unit-toggle button.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .two-btns{display:flex;gap:8px;margin-top:16px;}
  .two-btns button{
    flex:1;padding:14px 8px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;border:none;
  }
  .two-btns .primary{background:var(--coral);color:#fff;}
  .two-btns .secondary{background:#fff;border:1px solid var(--line);color:var(--teal);}
  .two-btns button:disabled{background:#D8C9AE;color:#8C826E;border-color:#D8C9AE;cursor:not-allowed;}
  .quick-amts{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;}
  .quick-amts button{
    flex:1;min-width:64px;padding:10px 4px;border-radius:9px;border:1px solid var(--line);
    background:#fff;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .quick-amts button.active{background:var(--coral);border-color:var(--coral);color:#fff;}
  .amt-preview{
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;
    font-size:13px;color:var(--ink-soft);
  }
  .amt-preview .qv2{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .empty-note{
    text-align:center;color:var(--ink-soft);font-size:14px;
    padding:40px 20px;
  }

  /* Cart bar */
  .cart-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--teal);
    color:#fff;
    padding:14px 16px;
    display:flex;justify-content:space-between;align-items:center;
    z-index:30;
    box-shadow:0 -4px 14px rgba(0,0,0,0.15);
  }
  .cart-bar.hidden{display:none;}
  .cart-bar .left{font-size:14px;}
  .cart-bar .left .amt{font-size:18px;font-weight:700;display:block;font-variant-numeric:tabular-nums;}
  .cart-bar button{
    background:var(--coral);color:#fff;border:none;border-radius:10px;
    padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;
  }

  .undo-toast{
    position:fixed;left:16px;right:16px;
    bottom:76px;
    max-width:608px;margin:0 auto;
    background:var(--ink);color:#fff;
    border-radius:12px;
    padding:12px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    z-index:40;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
  }
  .undo-toast.hidden{display:none;}
  .undo-toast .msg{font-size:13px;line-height:1.4;}
  .undo-toast button{
    background:none;border:1px solid rgba(255,255,255,0.4);color:#fff;
    padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
    white-space:nowrap;
  }

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,61,62,0.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  .modal-sheet{
    background:var(--sand);width:100%;max-width:640px;
    border-radius:20px 20px 0 0;
    max-height:88vh;overflow-y:auto;
    padding:18px 18px 24px 18px;
  }
  .modal-title{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .modal-title .close{color:var(--ink-soft);font-size:22px;cursor:pointer;padding:4px 8px;}

  .cart-row{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;
  }
  .cart-row .info{flex:1;}
  .cart-row .cname{font-weight:700;font-size:14px;}
  .cart-row .cline{font-size:12px;color:var(--ink-soft);margin-top:2px;font-variant-numeric:tabular-nums;}
  .cart-row .cline .strike{text-decoration:line-through;color:#B0A78F;}
  .editPrice{
    display:block;margin-top:6px;background:none;border:none;color:var(--teal);
    font-size:12px;font-weight:700;cursor:pointer;padding:2px 0;
  }
  .discount-badge{
    display:inline-block;background:var(--sand);color:var(--coral-dark);
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;
  }
  .price-editor{margin-top:6px;}
  .price-editor label{font-size:11px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:4px;}
  .price-editor input{
    width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);
    font-size:15px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .price-editor-btns{display:flex;gap:8px;margin-top:8px;}
  .price-editor-btns button{
    flex:1;padding:9px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;
  }
  .price-editor-btns .priceSave{background:var(--coral);color:#fff;}
  .price-editor-btns .priceCancel{background:#fff;border:1px solid var(--line);color:var(--ink-soft);}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
    background:#fff;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .stepper .qv{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;}
  .remove-x{color:var(--red);font-size:13px;font-weight:700;background:none;border:none;cursor:pointer;padding:4px;}

  .summary-block{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .summary-line{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;font-variant-numeric:tabular-nums;}
  .summary-line.total{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:10px;margin-top:6px;}

  .cash-row{margin-top:14px;}
  .cash-row label{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .cash-row input{
    width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--line);
    font-size:18px;font-variant-numeric:tabular-nums;background:#fff;color:var(--ink);
  }
  .change-line{margin-top:10px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .change-line.negative{color:var(--red);}
  .change-line.positive{color:var(--green);}

  .complete-btn{
    width:100%;margin-top:16px;padding:15px;background:var(--coral);color:#fff;
    border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;
  }
  .complete-btn:disabled{background:#D8C9AE;color:#8C826E;cursor:not-allowed;}

  /* Products tab */
  .prod-manage-row{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;
  }
  .prod-manage-row .info{flex:1;}
  .prod-manage-row .pname2{font-weight:700;font-size:14px;}
  .prod-manage-row .pmeta2{font-size:12px;color:var(--ink-soft);margin-top:2px;font-variant-numeric:tabular-nums;}
  .icon-btn{background:none;border:none;font-size:13px;font-weight:700;cursor:pointer;padding:6px 8px;}
  .icon-btn.edit{color:var(--teal);}
  .icon-btn.del{color:var(--red);}

  .add-form{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;
  }
  .add-form h3{margin:0 0 10px 0;font-size:15px;}
  .add-form label{font-size:12px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:4px;margin-top:10px;}
  .add-form input,.add-form select{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);font-size:14px;background:#fff;color:var(--ink);
  }
  .form-btn-row{display:flex;gap:8px;margin-top:14px;}
  .form-btn-row button{
    flex:1;padding:11px;border-radius:9px;border:none;font-size:14px;font-weight:700;cursor:pointer;
  }
  .form-btn-row .save{background:var(--coral);color:#fff;}
  .form-btn-row .cancel{background:#fff;border:1px solid var(--line);color:var(--ink-soft);}
  .fab-add{
    width:100%;padding:13px;border-radius:12px;border:2px dashed var(--line);background:transparent;
    color:var(--ink-soft);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px;
  }

  /* Expenses tab */
  .ex-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .ex-chip{padding:8px 10px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;}
  .ex-chip.on{background:var(--teal,#0F3D3A);color:#fff;border-color:var(--teal,#0F3D3A);}
  .ex-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;}
  .ex-row .info{flex:1;min-width:0;}
  .ex-row .en{font-weight:700;font-size:14px;}
  .ex-row .em{font-size:12px;color:var(--ink-soft);margin-top:2px;overflow-wrap:anywhere;}
  .ex-row .ea{font-weight:700;font-variant-numeric:tabular-nums;color:var(--red);white-space:nowrap;}
  .ex-bar{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .ex-bar:last-child{border-bottom:none;}

  /* History tab */
  .day-group{margin-bottom:12px;}
  .day-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit;}
  .day-head .dh-l{display:flex;flex-direction:column;gap:2px;font-size:14px;}
  .day-head small{font-size:12px;color:var(--ink-soft);}
  .day-head .dh-r{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:var(--coral-dark);white-space:nowrap;}
  .day-head .dh-r i{font-style:normal;font-size:10px;color:var(--ink-soft);margin-left:8px;}
  .day-stock{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .ds-title{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .ds-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:6px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline;}
  .ds-row:last-child{border-bottom:none;}
  .ds-row span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;}
  .ds-hd{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .sale-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;
  }
  .sale-top{display:flex;justify-content:space-between;align-items:baseline;}
  .sale-time{font-size:12px;color:var(--ink-soft);}
  .sale-total{font-weight:700;font-size:15px;color:var(--coral-dark);font-variant-numeric:tabular-nums;}
  .sale-items{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .hist-summary{
    display:flex;gap:10px;margin-bottom:14px;
  }
  .hist-stat{
    flex:1;background:var(--teal);color:#fff;border-radius:12px;padding:12px;
  }
  .hist-stat .n{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
  .hist-stat .l{font-size:11px;color:#B9D6CE;margin-top:2px;}

  .loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:14px;}

  /* Sell tab stock note */
  .stock-note{font-size:11px;color:var(--ink-soft);margin-top:4px;font-variant-numeric:tabular-nums;}
  .stock-note.low{color:var(--coral-dark);font-weight:700;}
  .stock-note.out{color:var(--red);font-weight:700;}

  /* Inventory tab */
  .fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .fin-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .fin-card .fl{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .fin-card .fv{font-size:17px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--ink);}
  .fin-card.accent .fv{color:var(--coral-dark);}
  .fin-card.positive .fv{color:var(--green);}
  .fin-card.negative .fv{color:var(--red);}
  .fin-note{font-size:11px;color:var(--ink-soft);margin:0 0 16px 2px;line-height:1.5;}
  .section-label{font-size:13px;font-weight:700;color:var(--ink);margin:18px 0 10px 2px;}

  .stock-row{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;
  }
  .stock-row.low-flag{border-color:var(--coral);}
  .stock-row .info{flex:1;}
  .stock-row .sname{font-weight:700;font-size:14px;}
  .stock-row .smeta{font-size:12px;color:var(--ink-soft);margin-top:2px;font-variant-numeric:tabular-nums;}
  .low-badge{
    display:inline-block;background:#FBE5DC;color:var(--coral-dark);font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;
  }
  .out-badge{
    display:inline-block;background:#F6D9D5;color:var(--red);font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;
  }
  .restock-btn{
    background:var(--teal);color:#fff;border:none;border-radius:9px;
    padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  }

  .lang-btn{width:auto;min-width:40px;padding:0 10px;font-size:11px;border-radius:18px;}
  .lang-opt{display:block;width:100%;padding:16px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:17px;font-weight:700;text-align:left;cursor:pointer;color:var(--ink);}
  .lang-opt.active{border:2px solid var(--coral);}
  #langModal{z-index:80;}

  /* Tutorial */
  .help-btn{
    width:32px;height:32px;border-radius:16px;border:1.5px solid rgba(255,255,255,0.55);
    background:transparent;color:#fff;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;
  }
  #tour.hidden{display:none;}
  #tourBlock{position:fixed;inset:0;z-index:70;background:rgba(10,43,44,0.6);}
  #tourBlock.clear{background:transparent;}
  #tourRing{
    position:fixed;z-index:71;border-radius:12px;pointer-events:none;display:none;
    box-shadow:0 0 0 9999px rgba(10,43,44,0.6);outline:3px solid var(--coral);
  }
  #tourCard{
    position:fixed;left:12px;right:12px;max-width:520px;margin:0 auto;z-index:72;
    background:var(--card);border-radius:16px;padding:16px 16px 14px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  #tourCard .tc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  #tourCard .tc-step{font-size:12px;color:var(--ink-soft);font-weight:700;}
  #tourCard .tc-skip{background:none;border:none;color:var(--ink-soft);font-size:12px;font-weight:700;cursor:pointer;padding:4px 0;}
  #tourCard h3{margin:0 0 6px 0;font-size:17px;}
  #tourCard p{margin:0;font-size:14px;line-height:1.5;color:var(--ink);}
  #tourCard .tc-dots{display:flex;gap:5px;margin:12px 0;}
  #tourCard .tc-dots i{width:7px;height:7px;border-radius:4px;background:var(--line);display:block;}
  #tourCard .tc-dots i.on{background:var(--coral);width:18px;}
  #tourCard .tc-btns{display:flex;gap:8px;}
  #tourCard .tc-btns button{flex:1;padding:13px 8px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;border:none;}
  #tourCard .tc-back{background:#fff;border:1px solid var(--line) !important;color:var(--ink-soft);}
  #tourCard .tc-next{background:var(--coral);color:#fff;flex:2 !important;}

  /* Trends tab */
  .range-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .range-toggle button{
    flex:1;padding:10px;border-radius:9px;border:1px solid var(--line);
    background:#fff;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .range-toggle button.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .t-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .t-card h3{margin:0 0 10px 0;font-size:14px;}
  .t-sub{font-size:12px;color:var(--ink-soft);margin:-6px 0 10px 0;line-height:1.4;}
  .delta-up{color:var(--green);font-weight:700;}
  .delta-down{color:var(--red);font-weight:700;}
  .bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:8px;}
  .bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;}
  .bar{width:100%;background:var(--coral);border-radius:4px 4px 0 0;min-height:2px;}
  .bar.zero{background:var(--line);}

['t1_title',"Welcome to your shrimp stall POS","Maligayang pagdating sa POS ng tindahan mo ng hipon","Maayong pag-abot sa POS sang imo tindahan sang pasayan"],
['t1_body',"This quick tour shows you how to sell, track your stock and see your profit. It takes about 2 minutes. You can replay it any time with the ? button at the top.","Ipapakita ng maikling gabay na ito kung paano magbenta, magbantay ng stock, at makita ang tubo mo. Mga 2 minuto lang ito. Maaari mo itong ulitin anumang oras gamit ang ? na button sa itaas.","Ipakita sang malip-ot nga giya nga ini kon paano magbaligya, magbantay sang stock, kag makita ang kita mo. Mga 2 ka minuto lang ini. Mahimo mo ini liwaton bisan san-o gamit ang ? nga button sa ibabaw."],
['t2_title',"First, set up your products","Una, ayusin ang mga produkto mo","Una, ayuha ang imo mga produkto"],
['t2_body',"Tap Products, then Edit on each item. Enter your selling price, what you pay for it (cost), and how much stock you have. The starting prices are samples, so replace them with your real ones.","Pindutin ang Produkto, tapos Baguhin sa bawat item. Ilagay ang presyo ng bentahan, ang binabayad mo (puhunan), at kung ilan ang stock mo. Mga halimbawa lang ang mga unang presyo, kaya palitan ng totoong presyo mo.","Pindota ang Produkto, dayon Usbon sa kada item. Butangi ang presyo sang baligya, ang ginabayad mo (puhunan), kag kon pila ang stock mo. Halimbawa lang ang mga una nga presyo, gani ilisi sang matuod mo nga presyo."],
['t3_title',"Tap a product to sell it","Pindutin ang produkto para ibenta","Pindota ang produkto para ibaligya"],
['t3_body',"Each tap adds 1 unit (for example 1 kg) to the order. A number badge shows how many you added, and the line below the price shows how much stock is left.","Bawat pindot ay nagdaragdag ng 1 yunit (halimbawa 1 kg) sa order. Ipinapakita ng numero kung ilan ang naidagdag mo, at ipinapakita ng linya sa ilalim ng presyo kung ilan pa ang natitirang stock.","Kada pindot nagadugang sang 1 ka yunit (pananglitan 1 kg) sa order. Ginapakita sang numero kon pila ang gindugang mo, kag ginapakita sang linya sa idalom sang presyo kon pila pa ang nabilin nga stock."],
['t4_title',"Other ways to sell","Ibang paraan ng pagbenta","Iban nga paagi sang pagbaligya"],
['t4_body',"By amount: the customer wants ₱100 worth. By weight: type kilos or grams. Edit price: for haggling. Choose “This sale only” for a one-time discount.","Sa halaga: gusto ng customer ng ₱100 na halaga. Sa timbang: i-type ang kilo o gramo. Baguhin ang presyo: para sa tawaran. Piliin ang “Para sa benta na ito” para sa isang beses na diskwento.","Sa kwarta: gusto sang kustomer ang ₱100 nga bili. Sa timbang: i-type ang kilo ukon gramo. Usbon ang presyo: para sa tawad. Pilia ang “Para sa sini nga baligya” para sa isa ka beses nga diskwento."],
['t5_title',"Made a mistake?","Nagkamali ka ba?","Nasayop ka bala?"],
['t5_body',"After you tap a product, a black bar appears for 5 seconds with an Undo button. To cancel the whole order, tap Clear twice. Nothing is saved until you complete the sale.","Pagkatapos mong pumindot ng produkto, may lalabas na itim na bar sa loob ng 5 segundo na may Ibalik na button. Para kanselahin ang buong order, pindutin ang I-clear nang dalawang beses. Walang nase-save hangga't hindi mo tinatapos ang benta.","Sa tapos mo magpindot sang produkto, may magaluwas nga itom nga bar sa sulod sang 5 ka segundo nga may Ibalik nga button. Para kanselahon ang bilog nga order, pindota ang Papas sing duha ka beses. Wala sing natipig tubtob indi mo matapos ang baligya."],
['t6_title',"Checking out","Pagbabayad","Pagbayad"],
['t6_body',"When the order is ready, tap Checkout at the bottom. Check the items. Type the cash received to see the change, or leave it blank if the customer paid the exact amount. Then tap Complete sale. Your stock goes down automatically.","Kapag handa na ang order, pindutin ang Magbayad sa ibaba. Tingnan ang mga item. I-type ang perang natanggap para makita ang sukli, o iwanang blangko kung eksakto ang bayad. Pagkatapos, pindutin ang Tapusin ang benta. Awtomatikong bababa ang stock mo.","Kon handa na ang order, pindota ang Bayad sa idalom. Tan-awa ang mga item. I-type ang kwarta nga nabaton agud makita ang sukli, ukon pabay-i nga blangko kon husto ang bayad. Dayon pindota ang Tapuson ang baligya. Awtomatiko nga magaubos ang stock mo."],
['t7_title',"Watch your stock and money","Bantayan ang stock at pera","Bantayi ang stock kag kwarta"],
['t7_body',"Inventory shows how much of each product is left. Tap Restock when you buy more shrimp and enter what you paid. The cards at the top show your capital, income and ROI.","Ipinapakita ng Stock kung ilan pa ang natitira sa bawat produkto. Pindutin ang Mag-restock kapag bumili ka ulit ng hipon at ilagay ang ibinayad mo. Ang mga card sa itaas ang nagpapakita ng puhunan, kita, at ROI mo.","Ginapakita sang Stock kon pila pa ang nabilin sa kada produkto. Pindota ang Dugang stock kon nagbakal ka liwat sang pasayan kag butangi ang ginbayad mo. Ang mga card sa ibabaw ginapakita ang puhunan, kita, kag ROI mo."],
['t8_title',"See what sells best","Tingnan kung ano ang pinakamabenta","Tan-awa kon ano ang pinakamabaligya"],
['t8_body',"Trends shows your best days, busiest hours and top products. In the calendar, darker days sold more. Tap a day to see its orders. It fills up as you make sales.","Ipinapakita ng Trend ang pinakamabentang araw, oras, at produkto. Sa kalendaryo, mas madilim ang araw na mas malaki ang benta. Pindutin ang isang araw para makita ang mga order. Mapupuno ito habang nagbebenta ka.","Ginapakita sang Trend ang pinakamabaligya nga adlaw, oras, kag produkto. Sa kalendaryo, mas madulom ang adlaw nga mas daku ang baligya. Pindota ang isa ka adlaw agud makita ang mga order. Mapuno ini samtang nagabaligya ka."],
['t9_title',"Save a backup every day","Mag-save ng backup araw-araw","Magtipig sang backup kada adlaw"],
['t9_body',"History lists every sale. At the end of each day, tap Save backup here. If your phone or the app is ever reset, you can restore all your records from that file.","Nakalista sa Talaan ang bawat benta. Sa katapusan ng araw, pindutin dito ang I-save ang backup. Kung ma-reset ang cellphone mo o ang app, maibabalik mo ang lahat ng record mula sa file na iyon.","Nakalista sa Rekord ang kada baligya. Sa katapusan sang adlaw, pindota diri ang Tipigi ang backup. Kon ma-reset ang cellphone mo ukon ang app, mabalik mo ang tanan nga rekord halin sa sina nga file."],
['t10_title',"You are ready to start","Handa ka na","Handa ka na"],
['t10_body',"Start with the Products tab, then make your first sale. Tap the ? button at the top any time to see this tour again.","Magsimula sa tab na Produkto, tapos gawin ang una mong benta. Pindutin ang ? na button sa itaas anumang oras para makita ulit ang gabay na ito.","Magsugod sa tab nga Produkto, dayon himoa ang una mo nga baligya. Pindota ang ? nga button sa ibabaw bisan san-o agud makita liwat ang giya nga ini."]

const I18N = {en:{}, fil:{}, hil:{}};
ROWS.forEach(r => { I18N.en[r[0]] = r[1]; I18N.fil[r[0]] = r[2]; I18N.hil[r[0]] = r[3]; });

function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key] !== undefined) ? I18N[LANG][key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if(vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  return s;
}
const UNIT_KEYS = {'per kg':'unit_kg', 'per tray':'unit_tray', 'per piece':'unit_piece', 'per pack':'unit_pack', 'per order':'unit_order'};
const UNIT_WORD_KEYS = {'per kg':'w_kg', 'per tray':'w_tray', 'per piece':'w_piece', 'per pack':'w_pack', 'per order':'w_order'};
function unitLabel(u){ return UNIT_KEYS[u] ? t(UNIT_KEYS[u]) : u; }
function unitWord(u){ return UNIT_WORD_KEYS[u] ? t(UNIT_WORD_KEYS[u]) : String(u).replace('per ', ''); }
function locale(){ return LANG === 'en' ? 'en-PH' : 'fil-PH'; }
function dowArr(){ return [0,1,2,3,4,5,6].map(i => t('dow' + i)); }

async function loadLang(){
  try{
    const r = await window.storage.get('lang', false);
    if(r && I18N[r.value]){ LANG = r.value; langStored = true; }
  }catch(e){}
}

function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.documentElement.lang = LANG;
  const lb = document.getElementById('langBtn');
  if(lb){ lb.textContent = LANG_CODES[LANG]; lb.setAttribute('aria-label', t('lang_aria')); }

const DEFAULT_PRODUCT_DEFS = [
  {id:'p1', k:'prod_small', unit:'per kg', price:280, costPrice:190, stock:10, lowStock:2},
  {id:'p2', k:'prod_medium', unit:'per kg', price:340, costPrice:230, stock:10, lowStock:2},

  {id:'p4', k:'prod_jumbo', unit:'per kg', price:520, costPrice:360, stock:6, lowStock:1},

  {id:'p6', k:'prod_tray', unit:'per tray', price:150, costPrice:95, stock:20, lowStock:4}
];
function getDefaultProducts(){
  return [];
}
function isUntouchedDefaults(){
  return false;
  if(products.length !== DEFAULT_PRODUCT_DEFS.length) return false;
  return DEFAULT_PRODUCT_DEFS.every((d, i) => {
    const p = products[i];
    return p && p.id === d.id && p.unit === d.unit && p.price === d.price && p.costPrice === d.costPrice &&
      p.stock === d.stock && p.lowStock === d.lowStock && ['en','fil','hil'].some(L => I18N[L][d.k] === p.name);
  });
}

async function setLang(l){
  if(!I18N[l]) return;
  const untouched = isUntouchedDefaults();
  LANG = l;
  langStored = true;
  try{ await window.storage.set('lang', l, false); }catch(e){}
  if(untouched){ products = getDefaultProducts(); await saveProducts(); }
  applyStaticI18n();
  setTodayDate();
  hideUndoToast();
  resetClearButtons();

async function loadData(){
  try{

  }catch(e){
    products = getDefaultProducts();
    try{ await window.storage.set('products', JSON.stringify(products), false); }catch(e2){}
  }
  products.forEach(p => {
    if(typeof p.costPrice !== 'number') p.costPrice = 0;
    if(typeof p.stock !== 'number') p.stock = 0;
    if(typeof p.lowStock !== 'number') p.lowStock = 1;
  });
  try{

  try{

function uid(){ return 'id' + Date.now() + Math.floor(Math.random()*1000); }

  return (Math.round(qty * 1000) / 1000).toString();
}

let sessionPrice = {};
function curPrice(p){

}

/* ---------- SELL TAB ---------- */
function renderSell(){
  const el = document.getElementById('tab-sell');
  if(products.length === 0){
    el.innerHTML = '<div class="empty-note">' + t('no_products') + '</div>';
  }else{
    el.innerHTML = '<div class="product-grid">' + products.map(p => {
      const qty = cart[p.id] ? cart[p.id].qty : 0;
      const low = p.stock <= p.lowStock;
      const out = p.stock <= 0;
      return `<div class="product-card" data-id="${p.id}">
        ${qty > 0 ? `<div class="qty-badge">${fmtQty(qty)}</div>` : ''}
        <div class="pname">${escapeHtml(p.name)}</div>
        <div>
          <div class="pmeta">${escapeHtml(unitLabel(p.unit))}</div>
          <div class="pprice">${curPrice(p) !== p.price ? `<span class="was">${PESO(p.price)}</span>` : ''}${PESO(curPrice(p))}</div>
          <div class="stock-note ${out ? 'out' : (low ? 'low' : '')}">${out ? t('out_of_stock') : t('left_n', {n: fmtQty(p.stock)})}</div>
          <div class="chip-row">
            <button class="amt-chip" data-act="amount" data-id="${p.id}">${t('by_amount')}</button>
            ${/kg/i.test(p.unit) ? `<button class="amt-chip" data-act="weight" data-id="${p.id}">${t('by_weight')}</button>` : ''}
            <button class="amt-chip" data-act="price" data-id="${p.id}">${t('edit_price')}</button>
          </div>
        </div>
      </div>`;
    }).join('') + '</div>';
    el.querySelectorAll('.product-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if(e.target.closest('.amt-chip')) return;
        const id = card.dataset.id;
        addToCart(id);
      });
    });
    el.querySelectorAll('.amt-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = chip.dataset.act;
        if(act === 'amount') openAmountModal(chip.dataset.id);
        else if(act === 'weight') openWeightModal(chip.dataset.id);
        else if(act === 'price') openPriceModal(chip.dataset.id);
      });
    });
  }
  updateCartBar();
}

function addToCart(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  if(!cart[id]) cart[id] = {qty:0, price:curPrice(p), originalPrice:p.price, costPrice:p.costPrice||0, name:p.name, unit:p.unit};
  cart[id].qty += 1;
  renderSell();
  showUndoToast(t('added_item', {name:p.name, unit:unitLabel(p.unit)}), () => {
    if(cart[id]){
      cart[id].qty -= 1;
      if(cart[id].qty <= 0) delete cart[id];
    }
    renderSell();
  });
}

let undoTimer = null;
function showUndoToast(message, undoFn, ms){
  clearTimeout(undoTimer);
  document.getElementById('undoMsg').textContent = message;
  const oldBtn = document.getElementById('undoBtn');
  const newBtn = oldBtn.cloneNode(true);
  oldBtn.parentNode.replaceChild(newBtn, oldBtn);
  newBtn.addEventListener('click', () => {
    undoFn();
    hideUndoToast();
  });
  document.getElementById('undoToast').classList.remove('hidden');
  undoTimer = setTimeout(hideUndoToast, ms || 5000);
}
function hideUndoToast(){
  document.getElementById('undoToast').classList.add('hidden');
  clearTimeout(undoTimer);
}

function cartCountAndTotal(){
  let count = 0, total = 0;
  Object.values(cart).forEach(c => { count += c.qty; total += c.qty * c.price; });
  return {count, total};
}

let clearPending = false;
let clearPendingTimer = null;

function clearCart(){
  const {count} = cartCountAndTotal();
  if(count === 0) return;
  const btn1 = document.getElementById('clearCartBtn');
  const btn2 = document.getElementById('clearCartBtnModal');

  if(!clearPending){
    clearPending = true;
    btn1.textContent = t('tap_confirm');
    btn1.style.background = 'var(--red)';
    btn1.style.borderColor = 'var(--red)';
    btn2.textContent = t('tap_again');
    clearPendingTimer = setTimeout(resetClearButtons, 3500);
    return;
  }

  clearTimeout(clearPendingTimer);
  resetClearButtons();
  cart = {};
  sessionPrice = {};
  hideUndoToast();
  renderSell();
  if(!document.getElementById('cartModal').classList.contains('hidden')){
    closeCartModal();
  }
}

function resetClearButtons(){
  clearPending = false;
  const btn1 = document.getElementById('clearCartBtn');
  const btn2 = document.getElementById('clearCartBtnModal');
  if(btn1){
    btn1.textContent = t('clear');
    btn1.style.background = 'transparent';
    btn1.style.borderColor = 'rgba(255,255,255,0.4)';
  }
  if(btn2){
    btn2.textContent = t('cancel_order');
  }
}

function updateCartBar(){
  const {count, total} = cartCountAndTotal();
  const bar = document.getElementById('cartBar');
  if(count === 0){ bar.classList.add('hidden'); clearTimeout(clearPendingTimer); resetClearButtons(); return; }
  bar.classList.remove('hidden');
  document.getElementById('cartCount').textContent = t(count === 1 ? 'items_one' : 'items_many', {n: fmtQty(count)});
  document.getElementById('cartAmt').textContent = PESO(total);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------- CART MODAL ---------- */
function openCartModal(){
  renderCartModal();
  document.getElementById('cartModal').classList.remove('hidden');
  document.getElementById('cashInput').value = '';
  updateChangeLine();
}
function closeCartModal(){
  document.getElementById('cartModal').classList.add('hidden');
}

function renderCartModal(){
  const rows = document.getElementById('cartRows');
  const ids = Object.keys(cart).filter(id => cart[id].qty > 0);
  if(ids.length === 0){
    rows.innerHTML = '<div class="empty-note">' + t('cart_empty') + '</div>';
  }else{
    rows.innerHTML = ids.map(id => {
      const c = cart[id];
      const discounted = c.originalPrice && Math.abs(c.price - c.originalPrice) > 0.001;
      const isEditing = editingPriceId === id;
      const priceArea = isEditing
        ? `<div class="price-editor">
            <label>${escapeHtml(t('price_unit', {unit: unitLabel(c.unit)}))}</label>
            <input type="number" inputmode="decimal" class="priceInput" value="${c.price}">
            <div class="price-editor-btns">
              <button class="priceCancel">${t('cancel')}</button>
              <button class="priceSave">${t('save_price')}</button>
            </div>
          </div>`
        : `<div class="cline">
            ${discounted ? `<span class="strike">${PESO(c.originalPrice)}</span> ` : ''}${PESO(c.price)} ${escapeHtml(unitLabel(c.unit))} &times; ${fmtQty(c.qty)} = ${PESO(c.price * c.qty)}
            <button class="editPrice">${t('edit_price')}</button>
          </div>`;
      return `<div class="cart-row" data-id="${id}">
        <div class="info">
          <div class="cname">${escapeHtml(c.name)} ${discounted ? '<span class="discount-badge">' + t('discounted') + '</span>' : ''}</div>
          ${priceArea}
        </div>
        ${isEditing ? '' : `<div class="stepper">
          <button class="dec">-</button>
          <span class="qv">${fmtQty(c.qty)}</span>
          <button class="inc">+</button>
        </div>
        <button class="remove-x">${t('remove')}</button>`}
      </div>`;
    }).join('');
    rows.querySelectorAll('.cart-row').forEach(row => {
      const id = row.dataset.id;
      const inc = row.querySelector('.inc');
      const dec = row.querySelector('.dec');
      const rem = row.querySelector('.remove-x');
      if(inc) inc.addEventListener('click', () => { cart[id].qty += 1; renderCartModal(); renderSell(); });
      if(dec) dec.addEventListener('click', () => {
        cart[id].qty -= 1;
        if(cart[id].qty <= 0) delete cart[id];
        renderCartModal(); renderSell();
      });
      if(rem) rem.addEventListener('click', () => { delete cart[id]; renderCartModal(); renderSell(); });
      const editBtn = row.querySelector('.editPrice');
      if(editBtn) editBtn.addEventListener('click', () => { editingPriceId = id; renderCartModal(); });
      const cancelBtn = row.querySelector('.priceCancel');
      if(cancelBtn) cancelBtn.addEventListener('click', () => { editingPriceId = null; renderCartModal(); });
      const saveBtn = row.querySelector('.priceSave');
      if(saveBtn) saveBtn.addEventListener('click', () => {
        const input = row.querySelector('.priceInput');
        const val = parseFloat(input.value);
        if(isNaN(val) || val < 0) return;
        cart[id].price = val;
        editingPriceId = null;
        renderCartModal();
        renderSell();
      });
    });
  }
  const {total} = cartCountAndTotal();
  document.getElementById('modalTotal').textContent = PESO(total);
  updateChangeLine();
}
let editingPriceId = null;

function updateChangeLine(){
  const {total} = cartCountAndTotal();
  const raw = document.getElementById('cashInput').value;
  const line = document.getElementById('changeLine');
  const btn = document.getElementById('completeBtn');
  if(total <= 0){
    line.textContent = '';
    btn.disabled = true;
    return;
  }
  if(raw === ''){
    line.textContent = t('paid_exact');
    line.className = 'change-line';
    btn.disabled = false;
    return;
  }
  const cashVal = parseFloat(raw);
  if(isNaN(cashVal)){
    line.textContent = '';
    btn.disabled = false;
    return;
  }
  const change = cashVal - total;
  if(change < 0){
    line.textContent = t('short_by', {amt: PESO(Math.abs(change))});
    line.className = 'change-line negative';
    btn.disabled = true;
  }else{
    line.textContent = t('change_is', {amt: PESO(change)});
    line.className = 'change-line positive';
    btn.disabled = false;
  }
}

async function completeSale(){
  const {total} = cartCountAndTotal();
  if(total <= 0) return;
  const entries = Object.entries(cart).filter(([id,c]) => c.qty > 0);
  const items = entries.map(([id,c]) => ({productId:id, name:c.name, unit:c.unit, price:c.price, originalPrice:c.originalPrice || c.price, costPrice:c.costPrice||0, qty:c.qty}));
  const discountTotal = items.reduce((sum,i) => sum + ((i.originalPrice - i.price) * i.qty), 0);
  const raw = document.getElementById('cashInput').value;
  const cashVal = raw === '' ? total : (parseFloat(raw) || total);
  const sale = {
    id: uid(),
    timestamp: new Date().toISOString(),
    items,
    total,
    discount: discountTotal > 0.001 ? discountTotal : 0,
    cash: cashVal,
    change: cashVal - total
  };
  sales.unshift(sale);
  await saveSales();
  entries.forEach(([id,c]) => {
    const p = products.find(x => x.id === id);
    if(p) p.stock = Math.round((p.stock - c.qty) * 1000) / 1000;
  });
  await saveProducts();
  cart = {};
  sessionPrice = {};
  closeCartModal();
  renderSell();
  updateTodayHeader();
  renderHistory();
}

  if(!p || isNaN(v) || v < 0){
    preview.innerHTML = t('price_hint');
    return;
  }
  const diff = p.price - v;
  let note = t('regular_is', {price: PESO(p.price), unit: escapeHtml(unitLabel(p.unit))});
  if(diff > 0.001) note += ' ' + t('off_by', {amt: '<span class="qv2">' + PESO(diff) + '</span>'});
  else if(diff < -0.001) note += ' ' + t('above_by', {amt: '<span class="qv2">' + PESO(-diff) + '</span>'});
  if(p.costPrice && v < p.costPrice) note += ' <span style="color:var(--red);font-weight:700;">' + t('below_cost', {amt: PESO(p.costPrice)}) + '</span>';
  preview.innerHTML = note;
}

function applyPrice(permanent){
  const p = products.find(x => x.id === priceProductId);
  const err = document.getElementById('priceModalError');
  const v = parseFloat(document.getElementById('priceModalInput').value);
  if(!p) return;
  if(isNaN(v) || v < 0){ err.textContent = t('valid_price'); return; }
  if(permanent){
    p.price = v;
    delete sessionPrice[p.id];
    if(cart[p.id]){ cart[p.id].originalPrice = v; cart[p.id].price = v; }
    saveProducts();
  }else{
    sessionPrice[p.id] = v;
    if(cart[p.id]) cart[p.id].price = v;
  }
  closePriceModal();
  renderSell();
}

    const finalStock = isNaN(stock) || stock < 0 ? 0 : stock;
    const finalLowStock = isNaN(lowStock) || lowStock < 0 ? 2 : lowStock;

    if(editing){

        products = products.filter(x => x.id !== np.id); delete cart[np.id];
        await saveProducts(); renderProducts(); renderSell(); updateCartBar();
      };
    }
    await saveProducts();
    editingProductId = null;

function computeFinancials(){
  const capitalInStock = products.reduce((sum,p) => sum + (p.stock * p.costPrice), 0);
  const totalInvested = purchases.reduce((sum,pu) => sum + pu.totalCost, 0);
  const grossRevenue = sales.reduce((sum,s) => sum + s.total, 0);
  const cogs = sales.reduce((sum,s) => sum + s.items.reduce((a,i) => a + (i.costPrice||0) * i.qty, 0), 0);
  const grossProfit = grossRevenue - cogs;
  const totalExpenses = expenses.reduce((sum,e) => sum + (e.total || 0), 0);
  const netIncome = grossProfit - totalExpenses;
  const roi = totalInvested > 0 ? (netIncome / totalInvested) * 100 : null;
  return {capitalInStock, totalInvested, grossRevenue, cogs, grossProfit, totalExpenses, netIncome, roi};
}

let restockProductId = null;

let restockEditId = null;
function openRestockModal(id, editPid){
  restockEditId = editPid || null;
  const pu = editPid ? purchases.find(x => x.id === editPid) : null;
  if(editPid && !pu) return;
  const p = products.find(x => x.id === (pu ? pu.productId : id));
  if(!p){ if(pu){ restockEditId = null; } return; }
  restockProductId = p.id;
  document.getElementById('restockModalTitle').textContent = pu ? t('edit_restock_title', {name: p.name}) : t('restock_title', {name: p.name});
  document.getElementById('restockAddBtn').textContent = pu ? t('save_changes') : t('add_to_stock');
  document.getElementById('restockQty').value = pu ? pu.qty : '';
  document.getElementById('restockCost').value = pu ? pu.costPerUnit : (p.costPrice || '');
  document.getElementById('restockError').textContent = '';
  updateRestockPreview();
  document.getElementById('restockModal').classList.remove('hidden');
}

function closeRestockModal(){
  restockEditId = null;
  document.getElementById('restockModal').classList.add('hidden');
  restockProductId = null;
}

function updateRestockPreview(){
  const p = products.find(x => x.id === restockProductId);
  const preview = document.getElementById('restockPreview');
  const qty = parseFloat(document.getElementById('restockQty').value);
  const cost = parseFloat(document.getElementById('restockCost').value);
  if(!p || isNaN(qty) || qty <= 0 || isNaN(cost) || cost < 0){
    preview.innerHTML = t('restock_hint');
    return;
  }
  const oldPu = restockEditId ? purchases.find(x => x.id === restockEditId) : null;
  const newStock = p.stock + qty - (oldPu ? oldPu.qty : 0);
  preview.innerHTML = t('restock_preview', {total: '<span class="qv2">' + PESO(qty * cost) + '</span>', stock: '<span class="qv2">' + fmtQty(newStock) + '</span>', unit: escapeHtml(unitWord(p.unit))});
}

async function submitRestock(){
  const p = products.find(x => x.id === restockProductId);
  const err = document.getElementById('restockError');
  const qty = parseFloat(document.getElementById('restockQty').value);
  const cost = parseFloat(document.getElementById('restockCost').value);
  if(!p) return;
  if(isNaN(qty) || qty <= 0){ err.textContent = t('valid_qty'); return; }
  if(isNaN(cost) || cost < 0){ err.textContent = t('valid_cost'); return; }
  const r3 = v => Math.round(v * 1000) / 1000;
  if(restockEditId){
    const pu = purchases.find(x => x.id === restockEditId);
    if(!pu) return;
    const before = {pu: {...pu}, stock: p.stock, costPrice: p.costPrice};
    const isLatest = purchases.find(x => x.productId === p.id) === pu;
    p.stock = Math.max(0, r3(p.stock + qty - pu.qty));
    if(isLatest) p.costPrice = cost;
    pu.qty = qty; pu.costPerUnit = cost; pu.totalCost = qty * cost;
    await saveProducts(); await savePurchases();
    closeRestockModal(); renderInventory(); renderSell();
    showUndoToast(t('u_restock_edited'), async () => {
      const cp = purchases.find(x => x.id === before.pu.id);
      if(cp) Object.assign(cp, before.pu);
      const cprod = products.find(x => x.id === p.id);
      if(cprod){ cprod.stock = before.stock; cprod.costPrice = before.costPrice; }
      await saveProducts(); await savePurchases(); renderInventory(); renderSell();
    }, 8000);
    return;
  }
  const prevStock = p.stock, prevCost = p.costPrice;
  p.stock = r3(p.stock + qty);
  p.costPrice = cost;
  const newPu = {
    id: uid(),
    timestamp: new Date().toISOString(),
    productId: p.id,
    productName: p.name,
    qty,
    costPerUnit: cost,
    totalCost: qty * cost
  };
  purchases.unshift(newPu);
  await saveProducts();
  await savePurchases();
  closeRestockModal();
  renderInventory();
  renderSell();
  showUndoToast(t('u_restock', {qty: fmtQty(qty), unit: unitWord(p.unit), name: p.name}), async () => {
    purchases = purchases.filter(x => x.id !== newPu.id);
    const cprod = products.find(x => x.id === p.id);
    if(cprod){ cprod.stock = Math.max(0, r3(cprod.stock - qty)); cprod.costPrice = prevCost; }
    await saveProducts(); await savePurchases(); renderInventory(); renderSell();
  }, 8000);
}

async function removePurchase(pid){
  const idx = purchases.findIndex(x => x.id === pid);
  if(idx < 0) return;
  const pu = purchases[idx];
  const prod = products.find(x => x.id === pu.productId);
  const r3 = v => Math.round(v * 1000) / 1000;
  const before = prod ? {stock: prod.stock, costPrice: prod.costPrice} : null;
  purchases.splice(idx, 1);
  if(prod){
    prod.stock = Math.max(0, r3(prod.stock - pu.qty));
    const prev = purchases.find(x => x.productId === prod.id);
    if(prev) prod.costPrice = prev.costPerUnit;
  }
  await saveProducts(); await savePurchases();
  renderInventory(); renderSell();
  showUndoToast(t('u_restock_removed'), async () => {
    purchases.splice(Math.min(idx, purchases.length), 0, pu);
    const cprod = products.find(x => x.id === pu.productId);
    if(cprod && before){ cprod.stock = before.stock; cprod.costPrice = before.costPrice; }
    await saveProducts(); await savePurchases(); renderInventory(); renderSell();
  }, 8000);
}

  {id:'helper', e:'🧑‍🔧'}, {id:'ice', e:'🧊'}, {id:'transport', e:'🚚'}, {id:'other', e:'📝'}
];
function catLabel(id){
  const c = EXP_CATS.find(x => x.id === id);
  return c ? c.e + ' ' + t('ec_' + id) : t('ec_other');
}
function todayInputValue(){ return dkey(new Date()); }
function expDateToIso(val, keepIso){
  const [y,m,d] = val.split('-').map(Number);
  const now = new Date();
  if(keepIso){
    const k = new Date(keepIso);
    if(dkey(k) === val) return keepIso;
  }
  const isToday = val === dkey(now);
  return new Date(y, m-1, d, isToday ? now.getHours() : 12, isToday ? now.getMinutes() : 0).toISOString();
}
function lastUnitAmt(cat){
  const e = expenses.slice().sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).find(x => x.cat === cat);
  return e ? e.unitAmt : '';
}
